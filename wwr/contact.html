<!DOCTYPE html>
<html lang="en-US">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Whitewater Rafting</title>
    <meta name="description"
      content="Contact Whitewater Rafting for questions, reservations, or suggestions.">
    <meta name="author" content="Wenndey Mae Ubatay">
    <link rel="stylesheet" href="styles/rafting.css">
</head>

<body>
    <header>
        <img src="images/wwr.jpg" alt="Whitewater Rafting Logo" width="200">
        <nav>
            <a href="index.html">Home</a>
            <a href="about.html">About Us</a>
            <a href="trips.html">Trips</a>
            <a href="contact.html">Contact Us</a>
        </nav>
    </header>
    <main>
        <section class="contact-info">
            <h2>The Whitewater Rafting</h2>

            <p>8H4W+3J9, Riverview Dr, Cagayan De Oro City,</p>
            <p>Misamis Oriental, 9000 Philippines</p>
            <p>+63 996 719 9604</p>
            <p>info@whitewaterrafting.com</p>

            <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d90316.7967902926!2d124.54900358042788!3d8.31010706363081!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x32ff86757a34a90d%3A0x91d3c6b38fa98df2!2sCDO%20White%20Water%20Rafting!5e0!3m2!1sen!2sph!4v1770291398342!5m2!1sen!2sph" width="600" height="450" style="border:0;" allowfullscreen="" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>
        </section>
        <section class="contact-form">
            <form>
                <div form="item-column2">
                    <label for="username">Name: </label>
                    <input type="text" id="username" name="username" required>
                </div>
                <div form="item-column2">
                    <label for="email">Email: </label>
                    <input type="text" id="email" name="email" required>
                </div>
                <fieldset>
                    <legend>Purpose of Message</legend>

                    <label><input type="radio" name="purpose" value="general" required> General Enquiry</label>
                    <label><input type="radio" name="purpose" value="reservation"> Reservation Question</label>
                    <label><input type="radio" name="purpose" value="website"> Website Suggestion</label>
                </fieldset>
                <div class="form-item">
                    <label for="message">Message:</label>
                    <textarea name="message" id="message" rows="4"></textarea>
                </div>
                <div class="form-item checkbox">
                    <label><input type="checkbox" id="subscribe" name="subscribe">Please subscribe me to the monthly newsletter</input></label>
                </div>
                    <button type="submit">Send Message</button>
            </form>
        </section>
        <section class="employees">
            <h2>Meet Our Team</h2>

            <div class="employees-grid">
                <figure>
                    <img src="images/rg.jpg" alt="River Guide" width="150">
                    <figcaption>Alen Gomez</figcaption>
                    <figcaption>Lead River Guide</figcaption>
                </figure>
                <figure>
                    <img src="images/om.jpg" alt="Operations Manager" width="150">
                    <figcaption>Laurenze Navarro</figcaption>
                    <figcaption>Operations Manager</figcaption>
                </figure>
                <figure>
                    <img src="images/cs.jpg" alt="Customer Support" width="150">
                    <figcaption>Shai Lim</figcaption>
                    <figcaption>Customer Support</figcaption>
                </figure>
            </div>
        </section>
    </main>
    <footer>
        <p>©2026 💦 Whitewater Rafting 💦 Wenndey Mae Ubatay</p>
        <nav class="socialmedia">
            <a href="https://facebook.com">
                <img src="images/facebook.png" alt="Facebook Logo"></a>
            <a href="https://linkedin.com">
                <img src="images/linkedin.png" alt="LinkedIn Logo"></a>
            <a href="https://instagram.com">
                <img src="images/instagram.png" alt="Instagram Logo"></a>
        </nav>
    </footer>
</body>

</html>
